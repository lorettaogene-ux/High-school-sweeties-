<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High School Hearts - Episode 2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <!-- Background Scene Image -->
        <div id="scene-bg" class="bg-fade"></div>

        <!-- Top Header HUD -->
        <div id="header-bar">
            <div class="location-badge">
                <span class="icon">📍</span> <span id="location-text">Kingsview High - Courtyard</span>
            </div>
            <div class="stats-badge">
                <span class="icon">👑</span> <span id="rep-text">Popularity: 50</span>
            </div>
            <div class="currency-badge">
                <span class="icon">💎</span> <span id="diamonds-count">120</span>
            </div>
        </div>

        <!-- Character Portrait Artwork Overlay Layer -->
        <div id="character-layer">
            <img id="character-sprite" src="" alt="Character Anime Portrait" class="hidden">
        </div>

        <!-- Interactive Story & UI Controls Overlay -->
        <div id="ui-overlay">
            <div id="dialogue-box" class="glass-panel">
                <div id="speaker-name" class="speaker-tag">Maya</div>
                <p id="dialogue-text">Loading episode...</p>
                <div id="tap-indicator" class="glow-arrow">TAP TO CONTINUE ▼</div>
            </div>

            <!-- Glowing Interactive Choice Buttons Container -->
            <div id="choices-container" class="hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
